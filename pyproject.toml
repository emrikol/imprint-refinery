[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"tests".msg = "do not import from the test suite"
"__future__.annotations".msg = "Home Assistant requires Python 3.14 or newer"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.imprint_refinery"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"custom_components/imprint_refinery/device_bridge.py" = ["PLC0415"]
"custom_components/imprint_refinery/frontend_bridge.py" = ["PLC0415"]
"custom_components/imprint_refinery/ir_formats/protocols/**" = ["TID252"]
"custom_components/imprint_refinery/zha_bridge.py" = ["PLC0415"]
"tests/**" = ["INP001", "PLC0415", "PT009", "PT027", "SLF001"]
"tools/**" = ["E402", "INP001", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
