default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        files: ^(custom_components/imprint_refinery|tests|tools)/.+\.py$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass
          - --skip=./.*,*.json,*.ircat,*.min.js
          - --quiet-level=2
        exclude_types: [json]
        exclude: ^custom_components/imprint_refinery/www/

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--pedantic]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^custom_components/imprint_refinery/www/
      - id: trailing-whitespace
        exclude: ^custom_components/imprint_refinery/www/

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.6.2
        files: \.(json|mjs|ts|yaml|yml)$
        exclude: ^custom_components/imprint_refinery/www/

  - repo: local
    hooks:
      - id: frontend-typecheck
        name: frontend typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: ^(frontend/.*\.ts|package(?:-lock)?\.json|tsconfig\.json)$
      - id: release-commit-changelog
        name: release commit changelog
        entry: python3 tools/check_release.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
