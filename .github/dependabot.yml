    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
