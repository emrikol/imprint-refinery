version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # This must match Home Assistant's built-in infrared integration.
      - dependency-name: infrared-protocols
        update-types: [version-update:semver-major]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 adds a native package for every supported platform.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    labels:
      - dependencies
