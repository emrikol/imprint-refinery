version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Home Assistant owns this version through its built-in infrared integration.
      - dependency-name: infrared-protocols
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 adds a native package for every supported platform.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    labels:
      - dependencies
